name: CI-CD

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, windows-latest, macos-latest]
        os: [ubuntu-latest]
        # continuous integration tests the newest python, python 3.13 is tested
        # locally with `tox r`, see README.md
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Install Python dev files and HDF5 support (Ubuntu only)
      run: |
           if [ "$RUNNER_OS" == "Linux" ]; then
               sudo add-apt-repository ppa:deadsnakes/ppa && sudo apt-get update && sudo apt-get install -y python${{ matrix.python-version }}-dev libhdf5-serial-dev
           fi
      shell: bash
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # the interpreter is cached with the packages instead of downloaded by every run
        cache-python: true

    - name: Test with tox
      # the tests run in parallel, the durations keep slow tests visible
      run:
        uvx --with tox-uv tox -e py${{ matrix.python-version }} -- -n auto --durations=15
